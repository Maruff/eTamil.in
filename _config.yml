title: eTamil
tagline: A FinTech DSL
description: >-
  eTamil is a programming language whose vocabulary is Tamil, built for Indian
  finance, tax and accounting. Exact decimal money, GST and double-entry
  accounting in the standard library, a bytecode VM, an HTTP server and SQL
  drivers — written in Rust.
url: https://etamil.in
baseurl: ""
lang: en-IN

author:
  name: Esan Maruff
  email: etamilindia@gmail.com
  photo: /assets/img/esan-maruff.webp
  linkedin: https://www.linkedin.com/in/bmaruff/

# Read by the theme, not by jekyll-seo-tag.
brand:
  name: eTamil.in
  version: "2.0.0"
  license: AGPL-3.0-or-later
  license_url: https://www.gnu.org/licenses/agpl-3.0.html
  compiler_repo: https://github.com/Maruff/eTamil_lang
  site_repo: https://github.com/Maruff/eTamil.in
  releases_url: https://github.com/Maruff/eTamil_lang/releases/latest
  # Deliberately unversioned asset names behind GitHub's /latest/ redirect, so
  # these links keep working after every release without editing this file.
  download_windows: https://github.com/Maruff/eTamil_lang/releases/latest/download/etamil-windows-x64.zip
  download_linux: https://github.com/Maruff/eTamil_lang/releases/latest/download/etamil-linux-x64.tar.gz
  # Raspberry Pi 4 and 5 on 64-bit Raspberry Pi OS, and any other aarch64 Linux.
  download_linux_arm64: https://github.com/Maruff/eTamil_lang/releases/latest/download/etamil-linux-arm64.tar.gz
  # macOS is two genuinely different binaries; one "x64" link would be wrong
  # for whichever half of the users it did not match.
  download_macos_arm64: https://github.com/Maruff/eTamil_lang/releases/latest/download/etamil-macos-arm64.tar.gz
  download_macos_x64: https://github.com/Maruff/eTamil_lang/releases/latest/download/etamil-macos-x64.tar.gz
  # kElir's APK rides on a release of THIS repository, not of kElir's own:
  # kElir is private, so a release asset there would need a login. The APK is
  # ~34 MB and would be committed whole on every build, so it is a release
  # asset rather than a file in assets/ — git keeps every copy of a binary
  # for ever. Unversioned name behind /latest/, like the links above.
  # Every release of this repository must therefore carry an asset of this
  # name, or the link goes dead.
  download_kelir_apk: https://github.com/Maruff/eTamil.in/releases/latest/download/kelir-android.apk
  # The version that link currently serves. Written by kElir's release
  # workflow, not by hand — the page said 1.1 while the link served 1.2 for
  # exactly as long as this was a number somebody had to remember to change.
  kelir_version: "2.11"
  paper_url: https://github.com/Maruff/eTamil_lang/blob/main/eTamil%20-%20An%20Indian%20FinTech%20DSL.pdf
  # The Marketplace listing. The extension carries the compiler, the
  # standard library, the examples and the eTamil font, so this is the
  # shortest install route there is for anyone already in VS Code.
  vscode_url: https://marketplace.visualstudio.com/items?itemName=etamil.etamil-support
  # The `_` and `__` marks that say which ASCII is English and which is
  # Tamil spelled in ASCII, which is what the eTamil font needs to know.
  script_rules_url: https://github.com/Maruff/eTamil_lang/blob/main/docs/reference/SCRIPT_RULES.md

# Read by jekyll-seo-tag.
logo: /assets/img/etamil-icon-512.png
twitter:
  card: summary_large_image
social:
  name: Esan Maruff
  links:
    - https://github.com/Maruff
    - https://www.linkedin.com/in/bmaruff/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

defaults:
  - scope: { path: "" }
    values:
      layout: page
      lang: en
      image: /assets/img/og-image.png
  - scope: { path: "ta" }
    values:
      layout: page
      lang: ta
      image: /assets/img/og-image-ta.png
  - scope: { path: "docs" }
    values:
      layout: page
      section: Research notes
      image: /assets/img/og-image.png
  - scope: { path: "article" }
    values:
      layout: page
      section: Research notes
      image: /assets/img/og-image.png

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # Editor sources. The built bundle lands in assets/ide/ and is committed;
  # these directories hold the Vite project that produces it and the build
  # scripts, and node_modules under them would otherwise be crawled every build.
  #
  # The trailing slashes are required, not tidiness. Jekyll excludes an entry
  # when `entry.start_with?(pattern)` is true as well as on a glob match, so a
  # bare `ide` also excludes `ide.html` — the editor page — and /ide/ silently
  # 404s while the nav link to it still renders.
  - ide/
  - tools/